<!DOCTYPE html>
<html lang="en">
<head>
    <title>CORS Test</title>
</head>
<body>
<h2>Test CORS</h2>
<button onclick="testCors()">Send Request</button>
<pre id="response"></pre>

<script>
    function testCors() {
        fetch('http://localhost:9605/adm/option', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json' // 告诉服务器发送的是 JSON 数据
            },
            body: JSON.stringify({
                "id": "test",
                "value": "test"
            }),
            // credentials: 'include' // 如果启用了 allowCredentials
        })
            .then(response => response.text())
            .then(data => {
                document.getElementById("response").innerText = data;
            })
            .catch(error => {
                document.getElementById("response").innerText = 'Error: ' + error.message;
            });
    }
</script>
</body>
</html>
